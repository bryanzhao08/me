  <dialog id="lightbox">
    <figure>

  <script src="../sky.js" defer></script>
  <script>
    const box = document.getElementById('lightbox');
    const shots = [...document.querySelectorAll('.photos button')];
    let at = 0;
    function show(i) {
      at = (i + shots.length) % shots.length;
      const img = shots[at].querySelector('img');
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox-img').alt = img.alt;
      document.getElementById('lightbox-cap').textContent = shots[at].dataset.title;
    }
    shots.forEach((b, i) => b.addEventListener('click', () => { show(i); box.showModal(); }));
    box.addEventListener('click', () => box.close());
    document.addEventListener('keydown', e => {
      if (!box.open) return;
      if (e.key === 'ArrowRight') show(at + 1);
      if (e.key === 'ArrowLeft') show(at - 1);
    });
  </script>
